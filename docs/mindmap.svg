<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#101a32"/><g font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f3f0e7" font-size="28" font-weight="700">МЕТОД И МЕТОДОЛОГИЯ В IT CREW</text><text x="600" y="95" text-anchor="middle" fill="#a4aec0" font-size="14">путь от рекламного брифа до результата</text><path d="M430 330H770M600 330V170M600 330V530" stroke="#d8f17c" stroke-width="4" stroke-dasharray="10 9"/><rect x="430" y="260" width="340" height="140" rx="14" fill="#172747" stroke="#d8f17c" stroke-width="3"/><text x="600" y="315" text-anchor="middle" fill="#d8f17c" font-size="25" font-weight="700">ИТ-ЗАДАЧА</text><text x="600" y="350" text-anchor="middle" fill="#f3f0e7" font-size="16">разместить и запустить рекламу</text><rect x="55" y="150" width="340" height="300" rx="14" fill="#f3f0e7"/><text x="85" y="205" fill="#101a32" font-size="29" font-weight="700">МЕТОД</text><text x="85" y="245" fill="#415170" font-size="16">конкретное действие</text><text x="85" y="300" fill="#101a32" font-size="16">• анализ требований</text><text x="85" y="337" fill="#101a32" font-size="16">• прототипирование</text><text x="85" y="374" fill="#101a32" font-size="16">• тестирование</text><text x="85" y="411" fill="#101a32" font-size="16">• эвристическая оценка</text><rect x="795" y="150" width="350" height="300" rx="14" fill="#ff806b"/><text x="825" y="205" fill="#101a32" font-size="29" font-weight="700">МЕТОДОЛОГИЯ</text><text x="825" y="245" fill="#40211c" font-size="16">система организации работы</text><text x="825" y="300" fill="#101a32" font-size="16">• итерационная разработка</text><text x="825" y="337" fill="#101a32" font-size="16">• короткие циклы</text><text x="825" y="374" fill="#101a32" font-size="16">• обратная связь</text><text x="825" y="411" fill="#101a32" font-size="16">• рабочий MVP на каждом шаге</text><rect x="390" y="535" width="420" height="95" rx="14" fill="#d8f17c"/><text x="600" y="575" text-anchor="middle" fill="#101a32" font-size="19" font-weight="700">БРИФ → ПРЕДЛОЖЕНИЯ → СДЕЛКА</text><text x="600" y="606" text-anchor="middle" fill="#344932" font-size="15">методология связывает методы в процесс</text></g></svg>
